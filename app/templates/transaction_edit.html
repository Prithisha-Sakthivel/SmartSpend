{% extends 'base.html' %}{% block content %}<div class="page-heading"><div><span class="eyebrow">LEDGER</span><h1>Edit transaction</h1><p class="muted">Your original values are saved so this change can be undone.</p></div><a class="button button-outline" href="{{ url_for('main.transactions') }}">Cancel</a></div><section class="content-panel narrow-panel"><form method="post" class="form-stack"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Type<select name="type"><option value="expense" {% if row.type=='expense' %}selected{% endif %}>Expense</option><option value="income" {% if row.type=='income' %}selected{% endif %}>Income</option></select></label><label>Description<input name="description" value="{{ row.description }}" required maxlength="100"></label><label>Amount (₹)<input type="number" min="0.01" step="0.01" name="amount" value="{{ '%.2f'|format(row.amount_paise/100) }}" required></label><label>Category<select name="category_id"><option value="">Uncategorized</option>{% for c in categories %}<option value="{{ c.id }}" {% if row.category_id==c.id %}selected{% endif %}>{{ c.name }}</option>{% endfor %}</select></label><label>Date<input type="date" name="occurred_on" value="{{ row.occurred_on }}" required></label><label>Notes<textarea name="notes" rows="3">{{ row.notes or '' }}</textarea></label><button class="button button-primary">Save changes →</button></form></section>{% endblock %}
